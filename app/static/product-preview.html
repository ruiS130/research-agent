<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Agent — product preview</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f6f4ef; --ink: #1a1a1a; --muted: #5c5c5c; --line: #d9d4c8;
      --accent: #0b6e4f; --accent-soft: #d8efe6; --card: #fffdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #e8f2ec 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #efe8d8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 0.35rem; }
    .lede { color: var(--muted); margin: 0 0 1.5rem; }
    .panel {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 1.1rem 1.2rem;
    }
    .panel h2 { margin: 0 0 0.85rem; font-size: 1.05rem; }
    .steps { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1rem; }
    .step {
      padding: 0.3rem 0.65rem; border-radius: 999px; border: 1px solid var(--line);
      font-size: 0.78rem; color: var(--muted); text-transform: lowercase;
    }
    .step.done { background: #eceae3; color: var(--ink); }
    .step.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    #report { line-height: 1.55; overflow-wrap: anywhere; }
    #report h1, #report h2, #report h3 { margin-top: 1.2em; }
    #report a { color: var(--accent); }
    .banner {
      font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem;
      padding: 0.6rem 0.8rem; border: 1px dashed var(--line); border-radius: 10px;
    }
    label { font-size: 0.9rem; color: var(--muted); display: block; margin-bottom: 0.35rem; }
    textarea {
      width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--line);
      border-radius: 10px; background: var(--card); font: inherit; margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="banner">Product preview (static snapshot for README) — live app is at <code>/</code></p>
    <h1>Research Agent</h1>
    <p class="lede">Multi-step research with live progress, then a markdown report.</p>
    <label>Topic</label>
    <textarea rows="2" readonly>Solid-state battery commercial barriers 2024-2025</textarea>
    <section class="panel">
      <h2>Live run</h2>
      <div class="steps">
        <span class="step done">plan</span>
        <span class="step done">search</span>
        <span class="step done">extract</span>
        <span class="step done">synthesize</span>
        <span class="step done">gap_check</span>
        <span class="step active">done</span>
      </div>
      <div class="meta">Finished · done (done) · job 0da2f6b2… · ~$0.000507 · 1 API call</div>
      <div id="report"></div>
    </section>
  </div>
  <script>
    const md = "# Research Brief: Solid-State Battery Commercial Barriers (2024\u20132025)\n\n## Summary\nSolid-state batteries (SSBs) are moving from research toward commercialization, with a likely path that starts in consumer electronics and later reaches electric vehicles (EVs) [1]. Current barriers cluster around electrolyte selection, interface stability, manufacturing scale-up, and cost [1][2].\n\n## Key Findings\n\n**Staged commercialization path.** Analysts describe a sequence in which SSBs first enter smaller consumer devices and then expand to EVs as the technology matures [1].\n\n**Electrolyte choice is a central decision.** Solid electrolytes fall into several main classes, each with different performance and processing trade-offs. Selecting among them shapes the whole commercialization timeline [1][2].\n\n**Interface stability is the near-term hurdle.** A 2025 perspective frames the path to industrial uptake in two steps: short-term improvements in interface stability, followed by longer-term work toward mass-market adoption [2].\n\n**Manufacturing and cost remain unresolved.** Scaling production from lab to factory and reducing cost are identified as major barriers to commercial deployment [1].\n\n## Commercial Barriers at a Glance\n\n| Barrier | Status in Sources |\n|---|---|\n| Electrolyte selection | Multiple classes; choice affects timeline [1][2] |\n| Interface stability | Priority for near-term development [2] |\n| Manufacturing scale-up | Identified as a key obstacle [1] |\n| Cost | Identified as a key obstacle [1] |\n| Industrial readiness | Roadmap from short-term fixes to mass-market adoption [2] |\n\n## Limitations\nThis brief relies on two sources: a commercialization overview and a perspective article. Both were reviewed at the summary level, so specific figures (cost targets, production volumes, dates) are not included. Readers should consult the full texts before relying on timelines.\n\n## Sources\n[1] https://atomfair.com/battery-research/solid-state-battery-commercialization-timelines/\n[2] https://www.sciencedirect.com/science/article/pii/S0378775325021913";
    document.getElementById("report").innerHTML = marked.parse(md);
  </script>
</body>
</html>
