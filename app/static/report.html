<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report · coming soon</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", serif;
      background: #f6f4ef;
      color: #1a1a1a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      max-width: 32rem;
      background: #fffdf8;
      border: 1px solid #d9d4c8;
      border-radius: 14px;
      padding: 1.5rem 1.6rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0.5rem 0; color: #5c5c5c; line-height: 1.45; }
    code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.85em;
      background: #eceae3;
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    a { color: #0b6e4f; }
    .meta { font-size: 0.9rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Report page — planned, not finished</h1>
    <p>
      A dedicated report view will live here (shareable URL, markdown + sources).
      Today reports still render on the <a href="/">home UI</a>.
    </p>
    <p class="meta">
      Job / session id: <code id="rid">—</code><br />
      See plan: <a href="/do-next">/do-next</a> · <a href="/">← Research</a>
    </p>
  </div>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const id = parts[0] === "report" ? parts[1] : "";
    if (id) document.getElementById("rid").textContent = id;
  </script>
</body>
</html>
