<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report · Research Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #d9d4c8;
      --accent: #0b6e4f;
      --accent-soft: #d8efe6;
      --card: #fffdf8;
      --danger: #9b1c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(1000px 420px at 0% 0%, #e8f2ec 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 2.2rem 1.25rem 4rem; }
    a { color: var(--accent); }
    h1 { margin: 0.2rem 0 0.35rem; font-size: clamp(1.6rem, 4vw, 2.1rem); }
    .nav { margin: 0 0 1.25rem; font-size: 0.95rem; }
    .topic { color: var(--muted); margin: 0 0 1rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0 0 1.25rem; }
    .actions[hidden], .banner[hidden], .sources[hidden], .access[hidden],
    #share-url[hidden], #panel[hidden] { display: none; }
    #share-url { width: min(100%, 24rem); }
    button, .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    button.primary, a.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.15rem 1.25rem 1.4rem;
    }
    .banner {
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      margin-bottom: 1rem;
    }
    .banner.error { background: #fde8e8; color: var(--danger); }
    #report { line-height: 1.55; overflow-wrap: anywhere; }
    #report h1, #report h2, #report h3 { margin-top: 1.15em; }
    .sources { margin-top: 1.5rem; }
    .sources h2 { margin: 0 0 0.6rem; font-size: 1.15rem; }
    .sources ol { margin: 0; padding-left: 1.3rem; }
    .sources li { margin: 0.55rem 0; }
    .points { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.92rem; }
    .access { display: grid; gap: 0.4rem; margin-top: 0.8rem; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: var(--card);
    }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="nav"><a href="/">← Research</a></p>
    <h1 id="title">Report</h1>
    <p class="topic" id="topic"></p>
    <div class="actions" id="actions" hidden>
      <button type="button" id="copy-link">Copy link</button>
      <input id="share-url" type="text" readonly hidden />
      <button type="button" id="download">Download .md</button>
    </div>
    <div id="banner" class="banner" role="status" hidden></div>
    <article class="panel" id="panel">
      <div id="access" class="access" hidden>
        <label for="access-code">Access code</label>
        <input type="password" id="access-code" autocomplete="current-password" />
        <button type="button" class="primary" id="access-submit">Continue</button>
      </div>
      <div id="report"></div>
      <section class="sources" id="sources" hidden>
        <h2>Cited sources</h2>
        <ol id="source-list"></ol>
      </section>
    </article>
  </div>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const jobId = parts[0] === "report" ? decodeURIComponent(parts[1] || "") : "";
    const titleEl = document.getElementById("title");
    const topicEl = document.getElementById("topic");
    const bannerEl = document.getElementById("banner");
    const reportEl = document.getElementById("report");
    const sourcesEl = document.getElementById("sources");
    const sourceListEl = document.getElementById("source-list");
    const actionsEl = document.getElementById("actions");
    const panelEl = document.getElementById("panel");
    const accessEl = document.getElementById("access");
    const accessInput = document.getElementById("access-code");
    let markdown = "";
    let pollTimer = null;

    const RUNNING = new Set([
      "pending", "planning", "searching", "extracting",
      "synthesizing", "checking", "running",
    ]);

    function authHeaders() {
      const key = (sessionStorage.getItem("research_access") || "").trim();
      if (!key) return {};
      const secure = location.protocol === "https:" ? "; Secure" : "";
      document.cookie =
        "research_access=" + encodeURIComponent(key) +
        "; Path=/; SameSite=Lax" + secure;
      return { "X-API-Key": key };
    }

    function setBanner(text, isError) {
      bannerEl.hidden = !text;
      bannerEl.textContent = text || "";
      bannerEl.className = "banner" + (isError ? " error" : "");
    }

    function slug(text) {
      const cleaned = (text || "report")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      return (cleaned || "report").slice(0, 60);
    }

    function historyToJob(data) {
      return {
        id: data.session_id,
        topic: data.topic,
        status: "done",
        report: data.report || "",
        sources: data.sources || [],
        error: null,
      };
    }

    async function fetchJob(id) {
      let res = await fetch("/research/" + encodeURIComponent(id), {
        headers: authHeaders(),
      });
      if (res.status === 404) {
        res = await fetch("/history/" + encodeURIComponent(id), {
          headers: authHeaders(),
        });
        if (res.ok) return { ok: true, job: historyToJob(await res.json()) };
        return { ok: false, status: res.status };
      }
      if (!res.ok) return { ok: false, status: res.status };
      return { ok: true, job: await res.json() };
    }

    function renderSources(sources) {
      sourceListEl.innerHTML = "";
      const rows = sources || [];
      if (!rows.length) {
        sourcesEl.hidden = true;
        return;
      }
      sourcesEl.hidden = false;
      rows.forEach((source, index) => {
        const li = document.createElement("li");
        li.id = "source-" + (index + 1);
        const url = source.url || source.source_url || "";
        const title = source.title || url || "Source " + (index + 1);
        if (url) {
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = title;
          li.appendChild(a);
        } else {
          li.textContent = title;
        }
        const points = source.key_points;
        if (Array.isArray(points) && points.length) {
          const p = document.createElement("p");
          p.className = "points";
          p.textContent = points.join(" ");
          li.appendChild(p);
        }
        sourceListEl.appendChild(li);
      });
    }

    function renderMarkdown(text, sources) {
      const parsed = window.marked ? marked.parse(text || "") : (text || "");
      const count = (sources || []).length;
      reportEl.innerHTML = parsed.replace(/\[(\d+)\]/g, (match, num) => {
        const n = Number(num);
        if (n >= 1 && n <= count) return '<a href="#source-' + n + '">[' + num + "]</a>";
        return match;
      });
    }

    function show(job) {
      document.title = (job.topic || "Report") + " · Research Agent";
      titleEl.textContent = job.status === "done" ? "Report" : "Research";
      topicEl.textContent = job.topic || "";
      markdown = job.report || "";
      const sources = job.sources || [];
      if (RUNNING.has(job.status)) {
        setBanner(
          "Still running" + (job.last_node ? " · " + job.last_node : "") + ". This page will update."
        );
        actionsEl.hidden = true;
      } else if (job.status === "error" || job.status === "interrupted") {
        setBanner(job.error || "This research run did not finish.", true);
        actionsEl.hidden = !markdown;
      } else {
        setBanner("");
        actionsEl.hidden = false;
      }
      if (markdown) renderMarkdown(markdown, sources);
      else if (!RUNNING.has(job.status)) {
        reportEl.className = "muted";
        reportEl.textContent = "This job has no report text yet.";
      } else {
        reportEl.textContent = "";
      }
      renderSources(sources);
      panelEl.hidden = RUNNING.has(job.status) && !markdown && !sources.length;
    }

    function showMissing() {
      document.title = "Report not found · Research Agent";
      titleEl.textContent = "Report not found";
      topicEl.textContent = jobId ? "No job or saved session matches " + jobId + "." : "Missing report id.";
      setBanner("");
      reportEl.innerHTML = '<p class="muted"><a href="/">Back to research</a></p>';
      sourcesEl.hidden = true;
      actionsEl.hidden = true;
      panelEl.hidden = false;
    }

    function showLocked() {
      titleEl.textContent = "Access code required";
      topicEl.textContent = "This server asks for an access code before it will show a report.";
      setBanner("");
      accessEl.hidden = false;
      const saved = sessionStorage.getItem("research_access") || "";
      if (saved) accessInput.value = saved;
      actionsEl.hidden = true;
      panelEl.hidden = false;
    }

    async function load() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
      if (!jobId) {
        showMissing();
        return;
      }
      accessEl.hidden = true;
      let result;
      try {
        result = await fetchJob(jobId);
      } catch (err) {
        setBanner("Could not reach the server.", true);
        return;
      }
      if (!result.ok && result.status === 401) {
        showLocked();
        return;
      }
      if (!result.ok) {
        showMissing();
        return;
      }
      show(result.job);
      if (RUNNING.has(result.job.status)) {
        pollTimer = setTimeout(load, 2000);
      }
    }

    document.getElementById("copy-link").addEventListener("click", async () => {
      const btn = document.getElementById("copy-link");
      const share = document.getElementById("share-url");
      try {
        await navigator.clipboard.writeText(location.href);
        share.hidden = true;
        btn.textContent = "Copied";
      } catch (err) {
        share.hidden = false;
        share.value = location.href;
        share.focus();
        share.select();
        btn.textContent = "Link selected";
      }
      setTimeout(() => { btn.textContent = "Copy link"; }, 1600);
    });

    document.getElementById("download").addEventListener("click", () => {
      const name = slug(topicEl.textContent) + ".md";
      const blob = new Blob([markdown || ""], { type: "text/markdown" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("access-submit").addEventListener("click", () => {
      const key = accessInput.value.trim();
      if (!key) return;
      sessionStorage.setItem("research_access", key);
      load();
    });

    load();
  </script>
</body>
</html>
